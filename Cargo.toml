[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
repository   = "https://github.com/bonpiedlaroute/nostr-remote-signer"

[workspace.dependencies]
nostr              = { version = "0.45", features  = ["std", "os-rng", "nip46"] }
nostr-sdk          = "0.45"
nostr-connect      = "0.45"
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
zeroize            = { version = "1", features = ["derive"] }