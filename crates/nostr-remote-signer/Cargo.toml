[package]
name        = "nostr-remote-signer"
description = "NIP-46 remote signer daemon with key custody, policy enforcement and audit."
license     = "AGPL-3.0-or-later"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true

[lib]
name = "nostr_remote_signer"
path = "src/lib.rs"

[[bin]]
name = "bunkerd"
path = "src/main.rs"

[dependencies]
nostr-remote-signer-core = { path = "../nostr-remote-signer-core", version = "0.1.0" }
nostr                    = { workspace = true }
nostr-connect            = { workspace = true }
tokio                    = { workspace = true }
anyhow                   = { workspace = true }
tracing                  = { workspace = true }
tracing-subscriber       = { workspace = true }
zeroize                  = { workspace = true }
age                      = { workspace = true }
chacha20poly1305         = { workspace = true }
base64                   = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
sha2                     = { workspace = true }
aws-sdk-kms              = { workspace = true, optional = true }
aws-config               = { workspace = true, optional = true }
libc                     = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }

[features]
default = []
aws     = ["dep:aws-sdk-kms", "dep:aws-config"]

[[bin]]
name = "leak_probe"
path = "src/bin/leak_probe.rs"